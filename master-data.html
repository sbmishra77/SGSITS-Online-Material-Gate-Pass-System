<!DOCTYPE html>

<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Master Data - SGSITS OM-GPS
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="app-header">

    <div class="logo-section left-logo">

        <img
            src="assets/sgsits-logo.png"
            alt="SGSITS Indore Logo"
            class="sgsits-logo"
        >

    </div>


    <div class="main-title">

        <div class="institution-name">

            <div class="sgsits-text">
                SGSITS
            </div>

            <div class="indore-text">
                INDORE
            </div>

        </div>


        <div class="system-name">

            <div class="english-title">

                Online Material Gate Pass System

                <span class="omgps">
                    (OM-GPS)
                </span>

            </div>


            <div class="hindi-title">

                ऑनलाइन मटेरियल गेट पास सिस्टम

            </div>

        </div>

    </div>


    <div class="logo-section right-logo">

        <img
            src="assets/csc-logo.png"
            alt="Campus Security Cell Logo"
            class="csc-logo"
        >

    </div>

</header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="dashboard-main">


        <section class="modules-section">

            <h2>
                Master Data
            </h2>

            <p class="modules-subtitle">
                मास्टर डेटा प्रबंधन
            </p>


            <div class="module-grid">


                <!-- DEPARTMENTS -->

               <button
    type="button"
    class="module-card"
    id="departmentsButton"
    onclick="window.location.href='department-management.html'">

                    <div class="module-icon">
                        🏢
                    </div>

                    <div class="module-content">

                        <h3>
                            Departments
                        </h3>

                        <p>
                            विभाग
                        </p>

                        <span>
                            Departments manage करें
                        </span>

                    </div>

                </button>



                <!-- SECTIONS / LABS -->

                <button
                    type="button"
                    class="module-card"
                    id="sectionsLabsButton"
                >

                    <div class="module-icon">
                        🧪
                    </div>

                    <div class="module-content">

                        <h3>
                            Sections / Labs
                        </h3>

                        <p>
                            सेक्शन / लैब
                        </p>

                        <span>
                            Sections और Labs manage करें
                        </span>

                    </div>

                </button>



                <!-- DESIGNATIONS -->

                <button
                    type="button"
                    class="module-card"
                    id="designationsButton"
                >

                    <div class="module-icon">
                        👤
                    </div>

                    <div class="module-content">

                        <h3>
                            Designations
                        </h3>

                        <p>
                            पद
                        </p>

                        <span>
                            Designations manage करें
                        </span>

                    </div>

                </button>



                <!-- SYSTEM RESPONSIBILITIES -->

                <button
                    type="button"
                    class="module-card"
                    id="responsibilitiesButton"
                >

                    <div class="module-icon">
                        🔐
                    </div>

                    <div class="module-content">

                        <h3>
                            System Responsibilities
                        </h3>

                        <p>
                            सिस्टम जिम्मेदारियाँ
                        </p>

                        <span>
                            Responsibilities manage करें
                        </span>

                    </div>

                </button>


            </div>

        </section>


        <!-- BACK TO DASHBOARD -->

        <div class="back-button-container">

            <button
                type="button"
                class="secondary-button"
                onclick="window.location.href='dashboard.html'"
            >

                ← Back to Dashboard

            </button>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <div id="omgpsFooterContainer"></div>


    <script
        type="module"
        src="footer.js"
    ></script>


</body>

</html>
