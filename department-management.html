<!DOCTYPE html>

<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Department Management - SGSITS OM-GPS
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="logo-section left-logo">

            <img
                src="assets/sgsits-logo.png"
                alt="SGSITS Indore Logo"
                class="sgsits-logo"
            >

        </div>


        <div class="main-title">

            <div class="institution-name">

                <div class="sgsits-text">
                    SGSITS
                </div>

                <div class="indore-text">
                    INDORE
                </div>

            </div>


            <div class="system-name">

                <div class="english-title">

                    Online Material Gate Pass System

                    <span class="omgps">
                        (OM-GPS)
                    </span>

                </div>


                <div class="hindi-title">

                    ऑनलाइन मटेरियल गेट पास सिस्टम

                </div>

            </div>

        </div>


        <div class="logo-section right-logo">

            <img
                src="assets/csc-logo.png"
                alt="Campus Security Cell Logo"
                class="csc-logo"
            >

        </div>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="dashboard-main">


        <section class="management-section">


            <!-- =========================
                 SECTION HEADER
            ========================== -->

            <div class="section-header">

                <div>

                    <h2>
                        Department Management
                    </h2>

                    <p>
                        विभाग प्रबंधन
                    </p>

                </div>


                <span
                    class="user-count"
                    id="departmentCount"
                >
                    0 Departments
                </span>

            </div>



            <!-- =========================
                 ADD DEPARTMENT
            ========================== -->

            <div class="form-grid">


                <div class="form-group">

                    <label for="departmentName">

                        Department Name / विभाग का नाम

                    </label>


                    <input
                        type="text"
                        id="departmentName"
                        placeholder="Department का नाम दर्ज करें"
                    >

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="saveDepartmentButton"
                        class="primary-button"
                    >

                        Add Department / विभाग जोड़ें

                    </button>

                </div>

            </div>



            <!-- =========================
                 EXISTING DEPARTMENTS
            ========================== -->

            <div class="section-header">

                <div>

                    <h2>
                        Existing Departments
                    </h2>

                    <p>
                        मौजूदा विभाग
                    </p>

                </div>

            </div>



            <div class="table-wrapper">

                <table class="users-table">

                    <thead>

                        <tr>

                            <th>
                                Department Name
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="departmentsTableBody">

                        <!-- Firebase departments यहाँ आएंगे -->

                    </tbody>

                </table>

            </div>



            <!-- =========================
                 BACK TO MASTER DATA
            ========================== -->

            <div class="back-button-container">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="window.location.href='master-data.html'"
                >

                    ← Back to Master Data

                </button>

            </div>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <div id="omgpsFooterContainer"></div>


    <script
        type="module"
        src="footer.js"
    ></script>

<script type="module" src="department-management.js"></script>
</body>

</html>
