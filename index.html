<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGSITS Online Material Gate Pass System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="app-header">

        <!-- LEFT : SGSITS LOGO -->
        <div class="logo-section left-logo">
            <img src="assets/sgsits-logo.png"
                 alt="SGSITS Indore Logo"
                 class="sgsits-logo">
        </div>


        <!-- CENTER : SGSITS INDORE + SYSTEM TITLE -->
<div class="main-title">

    <div class="institution-name">

        <div class="sgsits-text">
            SGSITS
        </div>

        <div class="indore-text">
            INDORE
        </div>

    </div>


    <div class="system-name">

        <div class="english-title">
            Online Material Gate Pass System <span class="omgps">(OM-GPS)</span>
        </div>

        <div class="hindi-title">
            ऑनलाइन मटेरियल गेट पास सिस्टम
        </div>

    </div>

</div>

        <!-- RIGHT : CSC LOGO -->
        <div class="logo-section right-logo">
            <img src="assets/csc-logo.png"
                 alt="Campus Security Cell Logo"
                 class="csc-logo">
        </div>

    </header>
<main class="login-area">

    <div class="login-card">

        <h2>Login</h2>

        <p class="login-subtitle">
            लॉगिन करें
        </p>

        <div class="form-group">

    <label for="userId">
        User ID / यूज़र आईडी
    </label>

    <input
        type="text"
        id="userId"
        name="userId"
        placeholder="अपनी यूज़र आईडी दर्ज करें"
    >

</div>

<div class="form-group password-group">
    <label for="password">Password / पासवर्ड</label>

    <div class="password-wrapper">
        <input type="password"
               id="password"
               name="password"
               placeholder="अपना पासवर्ड दर्ज करें">

        <button type="button"
                class="password-toggle"
                id="passwordToggle">
            👁️
        </button>
    </div>
</div>

<button type="button" class="login-button" id="loginButton">
    Login / लॉगिन करें
</button>

<p id="loginMessage" class="login-message"></p>

    </div>

</main>

<!-- =========================
     COMMON OM-GPS FOOTER
========================== -->

<div id="omgpsFooterContainer"></div>

<script src="footer.js"></script>


<script type="module" src="script.js"></script>

</body>
</html>
