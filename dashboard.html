<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OM-GPS Dashboard</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="logo-section left-logo">

            <img src="assets/sgsits-logo.png"
                 alt="SGSITS Indore Logo"
                 class="sgsits-logo">

        </div>


        <div class="main-title">

            <div class="institution-name">

                <div class="sgsits-text">
                    SGSITS
                </div>

                <div class="indore-text">
                    INDORE
                </div>

            </div>


            <div class="system-name">

                <div class="english-title">

                    Online Material Gate Pass System

                    <span class="omgps">
                        (OM-GPS)
                    </span>

                </div>


                <div class="hindi-title">

                    ऑनलाइन मटेरियल गेट पास सिस्टम

                </div>

            </div>

        </div>


        <div class="logo-section right-logo">

            <img src="assets/csc-logo.png"
                 alt="Campus Security Cell Logo"
                 class="csc-logo">

        </div>

    </header>



    <!-- =========================
         DASHBOARD
    ========================== -->

    <main class="dashboard-area">


        <div class="dashboard-card">


            <!-- =========================
                 WELCOME
            ========================== -->

            <div class="dashboard-welcome">

                <div>

                    <h1>
                        नमस्कार! <span id="userName">Loading...</span>
                    </h1>

                    <p>
                        SGSITS Online Material Gate Pass System
                    </p>

                    <p>
                        ऑनलाइन मटेरियल गेट पास सिस्टम
                    </p>

                </div>


                <div class="role-badge">

                    <span id="displayRole">
                        Loading...
                    </span>

                </div>

            </div>



            <!-- =========================
                 USER SUMMARY
            ========================== -->

            <div class="user-summary">

                <div class="summary-item">

                    <span class="summary-label">
                        विभाग / Department
                    </span>

                    <strong id="displayDepartment">
                        Loading...
                    </strong>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        User ID
                    </span>

                    <strong id="displayEmail">
                        Loading...
                    </strong>

                </div>

            </div>



            <!-- =========================
                 MODULES
            ========================== -->

            <div class="modules-section">

                <h2>
                    System Modules
                </h2>

                <p class="modules-subtitle">
                    सिस्टम मॉड्यूल
                </p>



                <div class="module-grid">


                    <!-- USER MANAGEMENT -->

                    <button
                        type="button"
                        class="module-card"
                        id="userManagementButton">

                        <div class="module-icon">
                            👥
                        </div>

                        <div class="module-content">

                            <h3>
                                User Management
                            </h3>

                            <p>
                                यूज़र प्रबंधन
                            </p>

                            <span>
                                Users और Roles manage करें
                            </span>

                        </div>

                    </button>



                    <!-- GATE PASS -->

                    <button
                        type="button"
                        class="module-card"
                        id="gatePassButton">

                        <div class="module-icon">
                            🎫
                        </div>

                        <div class="module-content">

                            <h3>
                                Gate Pass Management
                            </h3>

                            <p>
                                गेट पास प्रबंधन
                            </p>

                            <span>
                                Material Gate Pass देखें और manage करें
                            </span>

                        </div>

                    </button>



                    <!-- APPROVALS -->

                    <button
                        type="button"
                        class="module-card"
                        id="approvalButton">

                        <div class="module-icon">
                            ✓
                        </div>

                        <div class="module-content">

                            <h3>
                                Approvals
                            </h3>

                            <p>
                                अनुमोदन
                            </p>

                            <span>
                                Gate Pass approvals manage करें
                            </span>

                        </div>

                    </button>



                    <!-- REPORTS -->

                    <button
                        type="button"
                        class="module-card"
                        id="reportsButton">

                        <div class="module-icon">
                            📊
                        </div>

                        <div class="module-content">

                            <h3>
                                Reports
                            </h3>

                            <p>
                                रिपोर्ट्स
                            </p>

                            <span>
                                Gate Pass और system reports देखें
                            </span>

                        </div>

                    </button>



                    <!-- MASTER DATA -->

                    <button
    type="button"
    class="module-card"
    id="masterDataButton"
    onclick="window.location.href='master-data.html'">

                        <div class="module-icon">
                            🗂️
                        </div>

                        <div class="module-content">

                            <h3>
                                Master Data
                            </h3>

                            <p>
                                मास्टर डेटा
                            </p>

                            <span>
                                Department और अन्य master data
                            </span>

                        </div>

                    </button>



                    <!-- SYSTEM SETTINGS -->

                    <button
                        type="button"
                        class="module-card"
                        id="settingsButton">

                        <div class="module-icon">
                            ⚙️
                        </div>

                        <div class="module-content">

                            <h3>
                                System Settings
                            </h3>

                            <p>
                                सिस्टम सेटिंग्स
                            </p>

                            <span>
                                System configuration manage करें
                            </span>

                        </div>

                    </button>


                </div>

            </div>



            <!-- =========================
                 LOGOUT
            ========================== -->

            <div class="dashboard-footer">

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button">

                    Logout / लॉगआउट

                </button>

            </div>


        </div>

    </main>

<!-- =========================
     COMMON OM-GPS FOOTER
========================== -->

<div id="omgpsFooterContainer"></div>

<script src="footer.js"></script>

    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">


        import {

            onAuthStateChanged,
            signOut

        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {

            doc,
            getDoc

        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        import {

            auth,
            db

        } from "./firebase-config.js";



        /* =========================
           HTML ELEMENTS
        ========================== */

        const userName =
            document.getElementById("userName");

        const displayRole =
            document.getElementById("displayRole");

        const displayDepartment =
            document.getElementById("displayDepartment");

        const displayEmail =
            document.getElementById("displayEmail");

        const logoutButton =
            document.getElementById("logoutButton");



        /* =========================
           CHECK LOGIN + LOAD PROFILE
        ========================== */

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }


            displayEmail.textContent =
                user.email;


            try {

                const userDocRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userDoc =
                    await getDoc(userDocRef);


                if (!userDoc.exists()) {

                    userName.textContent =
                        "User";

                    displayRole.textContent =
                        "Profile नहीं मिला";

                    displayDepartment.textContent =
                        "-";

                    return;

                }


                const userData =
                    userDoc.data();


                /* =========================
                   NAME
                ========================== */

                userName.textContent =
                    userData.name || "User";


                /* =========================
                   ROLE
                ========================== */

                let role =
                    userData.role || "-";


                if (role === "super_admin") {

                    role =
                        "Super Admin";

                }


                displayRole.textContent =
                    role;


                /* =========================
                   DEPARTMENT
                ========================== */

                displayDepartment.textContent =
                    userData.department || "-";


                console.log(
                    "Dashboard user:",
                    userData
                );


            } catch (error) {

                console.error(
                    "Profile loading error:",
                    error
                );


                userName.textContent =
                    "User";

                displayRole.textContent =
                    "Error";

                displayDepartment.textContent =
                    "-";

            }

        });



        /* =========================
           LOGOUT
        ========================== */

        logoutButton.addEventListener(
            "click",
            async function () {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Logout नहीं हो पाया। कृपया दोबारा प्रयास करें।"
                    );

                }

            }
        );



        /* =========================
           MODULE BUTTONS
           TEMPORARILY DISABLED
        ========================== */

        document
    .getElementById("userManagementButton")
    .addEventListener("click", function () {

        window.location.href =
            "user-management.html";

    });


        document
            .getElementById("gatePassButton")
            .addEventListener("click", function () {

                alert(
                    "Gate Pass Management module जल्द उपलब्ध होगा।"
                );

            });


        document
            .getElementById("approvalButton")
            .addEventListener("click", function () {

                alert(
                    "Approvals module जल्द उपलब्ध होगा।"
                );

            });


        document
            .getElementById("reportsButton")
            .addEventListener("click", function () {

                alert(
                    "Reports module जल्द उपलब्ध होगा।"
                );

            });


        document
            .getElementById("masterDataButton")
            .addEventListener("click", function () {

                alert(
                    "Master Data module जल्द उपलब्ध होगा।"
                );

            });


        document
            .getElementById("settingsButton")
            .addEventListener("click", function () {

                alert(
                    "System Settings module जल्द उपलब्ध होगा।"
                );

            });


    </script>


</body>

</html>
