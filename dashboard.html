<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OM-GPS Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="logo-section left-logo">

            <img src="assets/sgsits-logo.png"
                 alt="SGSITS Indore Logo"
                 class="sgsits-logo">

        </div>


        <div class="main-title">

            <div class="institution-name">

                <div class="sgsits-text">
                    SGSITS
                </div>

                <div class="indore-text">
                    INDORE
                </div>

            </div>


            <div class="system-name">

                <div class="english-title">
                    Online Material Gate Pass System
                    <span class="omgps">(OM-GPS)</span>
                </div>

                <div class="hindi-title">
                    ऑनलाइन मटेरियल गेट पास सिस्टम
                </div>

            </div>

        </div>


        <div class="logo-section right-logo">

            <img src="assets/csc-logo.png"
                 alt="Campus Security Cell Logo"
                 class="csc-logo">

        </div>

    </header>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <main class="dashboard-area">

        <div class="dashboard-card">

            <h1>
                Welcome to OM-GPS
            </h1>

            <p>
                SGSITS Online Material Gate Pass System
            </p>

            <p>
                ऑनलाइन मटेरियल गेट पास सिस्टम
            </p>


            <!-- Logout Button -->

            <button
                type="button"
                id="logoutButton"
                class="logout-button">

                Logout / लॉगआउट

            </button>

        </div>

    </main>


    <!-- =========================
         FIREBASE AUTH
    ========================== -->

    <script type="module">

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            auth
        } from "./firebase-config.js";


        /* =========================
           CHECK LOGIN STATUS
        ========================== */

        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href = "index.html";

            }

        });


        /* =========================
           LOGOUT
        ========================== */

        const logoutButton =
            document.getElementById("logoutButton");


        logoutButton.addEventListener("click", function () {

            signOut(auth)

                .then(() => {

                    window.location.href = "index.html";

                })

                .catch((error) => {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Logout नहीं हो पाया। कृपया दोबारा प्रयास करें।"
                    );

                });

        });

    </script>


</body>

</html>
